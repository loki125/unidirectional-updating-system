services:

# NETWORK AGENT SERVICES
  mongo:
    image: mongo:7
    container_name: mongo
    restart: unless-stopped
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db
    networks:
      - na-net

  distributor:
    build: ./network-agent/distributor
    image: na-distributor:latest
    container_name: na_distributor
    restart: "no"
    ports:
      - "11080:11080"
    volumes:
      - store_volume:/data/store_volume:ro
      - ./network-agent/distributor/service:/service/service
    environment:
      STORE_PATH: /data/store_volume
      DB_HOST: http://mongo:27017
    networks:
      - na-net

  version-control:
    build: ./network-agent/version-control
    image: na-version-control:latest
    container_name: na-versionControl
    restart: "no"
    ports:
      - "40085:40085/udp"
    cap_add:
      - NET_ADMIN
    volumes:
      - updates_volume:/data/updates_volume
      - store_volume:/data/store_volume
      - ./network-agent/version-control/service:/service/service
    environment:
      OUTPUT_PATH: /data/updates_volume
      STORE_PATH: /data/store_volume
      DISTRIBUTOR_URL: http://distributor:11080
      UPDATE_FILE_REQUEST: /package
      FLUTE_PORT: "40085"
      IP: 238.1.1.95
    networks:
      - na-net

  mcast-forwarder:
    build: ./mcast-forwarder
    image: mcast-forwarder:latest
    container_name: mcast-forwarder
    cap_add:
      - NET_ADMIN
    privileged: true
    sysctls:
      - net.ipv4.ip_forward=1
    networks:
      um-net:
        ipv4_address: 172.30.0.254
      na-net:
        ipv4_address: 172.30.1.254


networks:
  na-net:
    name: network_na
    driver: bridge
    ipam:
      config:
        - subnet: 172.30.1.0/24
  
  # Connect to the network created by the other file
  um-net:
    external: true
    name: network_um

# LOCAL AGENT SERVICES



#VOLUMES

volumes:
  mongo_data:
  updates_volume:
  store_volume:
  