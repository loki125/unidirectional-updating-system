<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FLUTE CONTROL INTERFACE v1.2</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'JetBrains Mono', monospace;
            background-color: #f4f4f4; 
            color: #1a1a1a;
        }
        .ui-panel {
            background: #ffffff;
            border: 2px solid #1a1a1a;
            box-shadow: 6px 6px 0px #bcbcbc;
        }
        .retro-input {
            background: #ffffff;
            border: 1px solid #1a1a1a;
            color: #1a1a1a;
            padding: 8px;
            outline: none;
            border-radius: 0;
        }
        .retro-input:focus {
            background: #fafafa;
            box-shadow: 0 0 0 2px #1a1a1a;
        }
        .btn-black {
            background: #1a1a1a;
            color: #ffffff;
            padding: 10px;
            font-weight: bold;
            border-radius: 0;
            transition: all 0.1s;
        }
        .btn-black:hover {
            background: #444;
            transform: translate(-1px, -1px);
            box-shadow: 2px 2px 0px #000;
        }
        .btn-danger {
            background: #ffffff;
            color: #d11a1a;
            border: 2px solid #d11a1a;
            font-weight: bold;
        }
        .btn-danger:hover {
            background: #d11a1a;
            color: #ffffff;
        }
        .package-card {
            border: 1px solid #ddd;
            background: #fff;
            padding: 15px;
            cursor: pointer;
            transition: all 0.2s;
        }
        .package-card:hover {
            border-color: #1a1a1a;
            background: #fdfdfd;
            box-shadow: 4px 4px 0px #eee;
        }
        /* Modal Overlay */
        #infoModal {
            background: rgba(255, 255, 255, 0.9);
            backdrop-filter: blur(4px);
        }
    </style>
</head>
<body class="p-6">

    <div class="max-w-7xl mx-auto">
        <!-- HEADER -->
        <header class="mb-10 flex justify-between items-start border-b-4 border-black pb-4">
            <div>
                <h1 class="text-3xl font-bold tracking-tighter uppercase">Broadcast_Management_System</h1>
                <p class="text-sm font-bold opacity-60">STATION_ID: 001-ALPHA // LOCALHOST</p>
            </div>
            <div class="flex flex-col items-end gap-3">
                <div id="clock" class="text-sm font-bold">--:--:--</div>
                <button onclick="stopService()" class="btn-danger px-4 py-1 text-xs">STOP_SERVICE</button>
            </div>
        </header>

        <div class="grid grid-cols-1 lg:grid-cols-4 gap-8">
            
            <!-- LEFT: CONTROLS -->
            <div class="lg:col-span-1 space-y-6">
                <section class="ui-panel p-5">
                    <h2 class="font-bold border-b border-black mb-4 pb-1 text-sm">QUERY_FILTERS</h2>
                    <div class="space-y-4">
                        <div>
                            <label class="text-[10px] font-bold block mb-1">SEARCH_NAME</label>
                            <input id="searchName" type="text" placeholder="libc6" class="retro-input w-full text-sm">
                        </div>
                        <div>
                            <label class="text-[10px] font-bold block mb-1">OS_TYPE</label>
                            <input id="searchType" type="text" value="Debian" class="retro-input w-full text-sm">
                        </div>
                        <div>
                            <label class="text-[10px] font-bold block mb-1">ARCHITECTURE</label>
                            <select id="searchArch" class="retro-input w-full text-sm">
                                <option value="amd64">amd64</option>
                                <option value="arm64">arm64</option>
                                <option value="i386">i386</option>
                            </select>
                        </div>
                        <button onclick="checkInstance()" class="btn-black w-full text-xs py-3">FETCH_INSTANCES</button>
                    </div>
                </section>

                <section id="systemLog" class="ui-panel p-4 min-h-[150px]">
                    <h3 class="text-[10px] font-bold underline mb-2">SYSTEM_LOG</h3>
                    <div id="logContent" class="text-[10px] leading-relaxed opacity-80">Awaiting input...</div>
                </section>
            </div>

            <!-- RIGHT: RESULTS -->
            <div class="lg:col-span-3">
                <div class="ui-panel p-6 min-h-[600px]">
                    <div class="flex justify-between items-center mb-6">
                        <h2 class="font-bold text-xl uppercase tracking-widest">Instance_Registry</h2>
                        <span id="recordCount" class="text-xs font-bold bg-black text-white px-2">0 RECORDS</span>
                    </div>

                    <div id="metadataContainer" class="grid grid-cols-1 md:grid-cols-2 xl:grid-cols-3 gap-4">
                        <!-- Cards injected here -->
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- INFO MODAL -->
    <div id="infoModal" class="fixed inset-0 hidden flex items-center justify-center z-50 p-4">
        <div class="ui-panel max-w-2xl w-full p-8 relative">
            <button onclick="closeModal()" class="absolute top-4 right-4 font-bold hover:underline">[CLOSE_X]</button>
            <h2 class="text-2xl font-bold border-b-2 border-black mb-6">PACKAGE_INSPECTOR</h2>
            
            <div id="modalBody" class="space-y-4 text-sm mb-8">
                <!-- Info content here -->
            </div>

            <div class="flex gap-4 border-t border-gray-200 pt-6">
                <button id="modalBroadcastBtn" class="btn-black flex-1 py-4">CONFIRM_BROADCAST</button>
                <button onclick="closeModal()" class="border-2 border-black px-6 py-4 font-bold">CANCEL</button>
            </div>
        </div>
    </div>

    <script>
        // UI CLOCK
        setInterval(() => {
            document.getElementById('clock').innerText = new Date().toLocaleTimeString();
        }, 1000);

        function log(msg, error = false) {
            const content = document.getElementById('logContent');
            const time = new Date().toLocaleTimeString();
            content.innerHTML = `<div class="${error ? 'text-red-600' : ''}">[${time}] ${msg}</div>` + content.innerHTML;
        }

        function stopService() {
            if(confirm("CRITICAL: STOP ALL BROADCAST SERVICES?")) {
                log("SYSTEM_SHUTDOWN_SIGNAL_SENT", true);
                alert("Service stop signal triggered.");
            }
        }

        async function checkInstance() {
            const name = document.getElementById('searchName').value;
            const type = document.getElementById('searchType').value;
            const arch = document.getElementById('searchArch').value;
            const container = document.getElementById('metadataContainer');

            if(!name) return log("INPUT_REQUIRED: PKG_NAME", true);

            log(`FETCHING: ${name} (${arch})...`);
            container.innerHTML = "...SCANNING_DATABASE...";

            try {
                // Adjust params as per your backend
                const res = await fetch(`/instance?package_name=${name}&type=${type}&architecture=${arch}`);
                const data = await res.json();

                container.innerHTML = "";
                
                if (data.error || !Array.isArray(data) || data.length === 0) {
                    container.innerHTML = "<div class='col-span-full opacity-50'>ZERO_RESULTS_RETURNED</div>";
                    document.getElementById('recordCount').innerText = "0 RECORDS";
                    return;
                }

                document.getElementById('recordCount').innerText = `${data.length} RECORDS`;

                data.forEach(pkg => {
                    const card = document.createElement('div');
                    card.className = "package-card";
                    card.onclick = () => fetchPackageInfo(pkg.package_name || name, pkg.version, pkg.architecture || arch);
                    
                    card.innerHTML = `
                        <div class="text-[10px] font-bold opacity-40 uppercase">Identifier</div>
                        <div class="font-bold mb-2">${pkg.package_name || name}</div>
                        <div class="text-[10px] font-bold opacity-40 uppercase">Version</div>
                        <div class="mb-2 text-sm">${pkg.version}</div>
                        <div class="text-[10px] font-bold opacity-40 uppercase">Arch</div>
                        <div class="text-sm">${pkg.architecture || arch}</div>
                        <div class="mt-4 text-[10px] font-bold text-right underline">INSPECT_DETAILS ></div>
                    `;
                    container.appendChild(card);
                });
            } catch (e) {
                log("FETCH_ERROR: SERVER_UNREACHABLE", true);
            }
        }

        async function fetchPackageInfo(name, version, arch) {
            log(`INSPECTING: ${name}_${version}`);
            try {
                const res = await fetch(`/info?package_name=${name}&version=${version}&architecture=${arch}`);
                const data = await res.json();
                
                openModal(data, name, version, arch);
            } catch (e) {
                log("INFO_FETCH_FAILURE", true);
            }
        }

        function openModal(data, name, version, arch) {
            const modalBody = document.getElementById('modalBody');
            const broadcastBtn = document.getElementById('modalBroadcastBtn');
            
            let html = `<div class="grid grid-cols-2 gap-4">`;
            for (const [key, value] of Object.entries(data)) {
                html += `<div><label class="text-[10px] font-bold opacity-50 block">${key.toUpperCase()}</label><span>${value}</span></div>`;
            }
            html += `</div>`;
            
            modalBody.innerHTML = html;
            broadcastBtn.onclick = () => {
                closeModal();
                executeBroadcast(name, version, arch);
            };

            document.getElementById('infoModal').classList.remove('hidden');
        }

        function closeModal() {
            document.getElementById('infoModal').classList.add('hidden');
        }

        async function executeBroadcast(name, version, arch) {
            log(`INIT_BROADCAST: ${name}...`);
            try {
                const res = await fetch(`/update?package_name=${name}&version=${version}&architecture=${arch}`, {method: 'POST'});
                if(res.ok) log(`SUCCESS: ${name} BROADCAST_COMPLETE`);
                else log(`FAILED: ${name} BROADCAST_REJECTED`, true);
            } catch (e) {
                log("IO_CONNECTION_LOST", true);
            }
        }
    </script>
</body>
</html>
