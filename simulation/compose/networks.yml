services:
  router:
    build: ${ROUTER_PATH}
    image: router:latest
    container_name: router
    cap_add:
      - NET_ADMIN
    privileged: true
    env_file:
      - .env
    sysctls:
      - net.ipv4.ip_forward=1
    networks:
      outside-net:
        ipv4_address: 172.30.0.254
      mcast-gateway:
        ipv4_address: 172.30.1.2
      view-net:
        ipv4_address: 172.30.2.254

  network-provisioner:
    image: alpine:latest
    container_name: network-provisioner
    command: sleep infinity
    restart: always
    networks:
      isolated-net:
        ipv4_address: 192.168.50.2


networks:
  outside-net:
    name: outside-net
    driver: bridge
    ipam:
      config:
        - subnet: 172.30.0.0/24

  mcast-gateway:
    name: mcast-gateway
    driver: bridge
    driver_opts:
      com.docker.network.bridge.multicast_snooping: "false"
    ipam:
      config:
        - subnet: 172.30.1.0/29

  view-net:
    name: view-net
    driver: bridge
    ipam:
      config:
        - subnet: 172.30.2.0/24

  isolated-net:
    name: isolated-net
    driver: bridge
    driver_opts:
      com.docker.network.bridge.name: br-isolated
    ipam:
      config:
        - subnet: 192.168.50.0/24
          gateway: 192.168.50.1