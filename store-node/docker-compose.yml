
x-common-env: &common-env
  STORE_PATH: ${STORE_PATH}
  MONGO_URI: ${MONGO_URI}
  MONGO_PACKAGES_DB: ${MONGO_PACKAGES_DB}
  MONGO_PACKAGES_COLLECTION: ${MONGO_PACKAGES_COLLECTION}
  MONGO_HEALTH_DB: ${MONGO_HEALTH_DB}
  MONGO_HEALTH_COLLECTION: ${MONGO_HEALTH_COLLECTION}
  UPDATE_FILE_REQUEST : ${UPDATE_FILE_REQUEST}

services:
  mongo:
    image: mongo:7
    container_name: mongo
    restart: unless-stopped
    ports:
      - "${MONGO_PORT}:27017"
    volumes:
      - mongo_data:/data/db
    networks:
      isolated-net:
        ipv4_address: 192.168.50.5
    command: mongod --wiredTigerCacheSizeGB=0.25 --quiet --logpath /dev/null
    logging:
      driver: "none"
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 3s
      timeout: 3s
      retries: 10

  distributor:
    build: ./distributor
    image: distributor:latest
    container_name: distributor
    restart: "no"
    depends_on:
      mongo:
        condition: service_healthy
    ports:
      - "${DISTRIBUTOR_PORT}:11080"
    volumes:
      - store_volume:${STORE_PATH}:ro
      - ./distributor/service:/service/service
    environment:
      <<: *common-env
    networks:
      isolated-net:
        ipv4_address: 192.168.50.4

  store-manager:
    build: ./store-manager
    image: store-manager:latest
    container_name: store-manager
    restart: "no"
    privileged: true 
    depends_on:
      mongo:
        condition: service_healthy
    ports:
      - "${FLUTE_PORT}:${FLUTE_PORT}/udp"
    cap_add:
      - NET_ADMIN
    volumes:
      - updates_volume:${UPDATES_PATH}
      - store_volume:${STORE_PATH}
      - ./store-manager/service:/service/service
    environment:
      <<: *common-env
      OUTPUT_PATH: ${UPDATES_PATH}
      DISTRIBUTOR_URL: http://distributor:${DISTRIBUTOR_PORT}
      FLUTE_PORT: ${FLUTE_PORT}
      FLUTE_IP: ${MULTICAST_IP}
      VIEW_PORT: ${VIEW_PORT}
      VIEW_IP: ${VIEW_IP}
    networks:
      mcast-gateway:
          ipv4_address: 172.30.1.3
      isolated-net:
          ipv4_address: 192.168.50.3
    sysctls:
      - net.ipv4.conf.all.rp_filter=0
      - net.ipv4.conf.default.rp_filter=0


networks:
  isolated-net:
    external: true
    name: isolated-net

  mcast-gateway:
    external: true
    name: mcast-gateway

volumes:
  mongo_data:
  updates_volume:
  store_volume:
