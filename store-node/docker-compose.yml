services:
  mongo:
    image: mongo:7
    container_name: mongo
    restart: unless-stopped
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db
    networks:
      - na-net
    command: mongod --quiet --logpath /dev/null
    logging:
      driver: "none"

  distributor:
    build: ./distributor
    image: distributor:latest
    container_name: distributor
    restart: "no"
    ports:
      - "11080:11080"
    volumes:
      - store_volume:/data/store_volume:ro
      - ./distributor/service:/service/service
    environment:
      STORE_PATH: /data/store_volume
      DB_HOST: mongodb://mongo:27017

  store-manager:
    build: ./store-manager
    image: store-manager:latest
    container_name: store-manager
    restart: "no"
    ports:
      - "40085:40085/udp"
    cap_add:
      - NET_ADMIN
    volumes:
      - updates_volume:/data/updates_volume
      - store_volume:/data/store_volume
      - ./store-manager/service:/service/service
    environment:
      OUTPUT_PATH: /data/updates_volume
      STORE_PATH: /data/store_volume
      DISTRIBUTOR_URL: http://distributor:11080
      UPDATE_FILE_REQUEST: /package
      FLUTE_PORT: "40085"
      IP: 238.1.1.95
    networks:
      - mcast-gateway

  mcast-fwdr:
    build: ./mcast-fwdr
    image: mcast-fwdr:latest
    container_name: mcast-fwdr
    cap_add:
      - NET_ADMIN
    privileged: true
    sysctls:
      - net.ipv4.ip_forward=1
    networks:
      um-net:
        ipv4_address: 172.30.0.254
      mcast-gateway:
        ipv4_address: 172.30.1.2


networks:
  mcast-gateway:
    name: mcast-gateway
    driver: bridge
    ipam:
      config:
        - subnet: 172.30.1.0/30
  
  # Connect to the network created by the other file
  um-net:
    external: true
    name: network_um

#VOLUMES

volumes:
  mongo_data:
  updates_volume:
  store_volume:
  